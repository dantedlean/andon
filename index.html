<style>
/* Layout: barra branca fixa + uma vista por vez; monitores em grade de cards brancos sobre cinza-claro (visual da tela Gestão) */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141A22; --muted:#5B6675; --faint:#8A94A3;
  --line:#DDE3EA; --line2:#EEF1F5; --track:#E6EAF0;
  --brand:#1B4D8F; --brand-ink:#12365F; --brand-soft:#E4ECF7;
  --ok:#1E7B45; --ok-soft:#E3F4EA; --warn:#D08A00; --warn-ink:#8A5300; --warn-soft:#FFF4E0;
  --bad:#C62828; --bad-ink:#B42318; --bad-soft:#FDE8E7;
  --f-body:'Barlow', 'Segoe UI', system-ui, sans-serif;
  --f-num:'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-family:var(--f-num);font-weight:700;line-height:1}
.lbl{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--brand)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px}
.logo{height:40px;width:auto;display:block}
.brandtxt{display:flex;flex-direction:column;line-height:1.1}
.brandtxt b{font-size:1.15rem}
.brandtxt span{font-size:.85rem;color:var(--muted)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
nav.tabs a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
nav.tabs a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
nav.tabs a:hover{color:var(--ink)}
.top-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.inp{min-height:44px;padding:0 12px;border:1px solid #C9D2DC;border-radius:8px;background:var(--surface);min-width:0}
.inp:disabled{background:var(--line2);color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #C9D2DC;background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.danger{color:var(--bad-ink);border-color:#F1B8B4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 10px;font-size:.9rem}

main#view{padding-block:20px 32px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;min-width:0}
.panel h2{margin:0;font-size:1.2rem;text-wrap:balance}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:20px}
.empty{padding:40px 24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed #C9D2DC;border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn-ink)}
.p-late,.p-stop{background:var(--bad-soft);color:var(--bad-ink)} .p-wait{background:var(--line2);color:var(--muted)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn-ink)} .c-late,.c-stop{color:var(--bad-ink)} .c-wait{color:var(--muted)}
.b-ok{background:var(--ok);color:#fff} .b-warn{background:var(--warn);color:var(--ink)} .b-late{background:var(--bad);color:#fff}
.b-stop{background:var(--bad);color:#fff;animation:pulse 1.4s ease-in-out infinite} .b-wait{background:#7D8796;color:#fff}
@keyframes pulse{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.b-stop,.call{animation:none}}

/* monitor geral */
.mhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;margin-bottom:18px}
.mhead .clock{display:flex;flex-direction:column;align-items:flex-end}
.mhead .clock .num{font-size:clamp(36px,min(4vw,7vh),64px)}
.mkpis{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center}
.mkpis .num{font-size:clamp(28px,min(3vw,6vh),52px)}
.dots{display:flex;flex-wrap:wrap;gap:14px;font-size:1.1rem;font-weight:600}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot i{width:13px;height:13px;border-radius:50%;display:inline-block}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.cc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.cc.stop{border:3px solid var(--bad)}
.band{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 22px}
.band .cn{font-size:clamp(20px,min(1.9vw,3.6vh),30px);font-weight:700}
.band .sl{display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:clamp(20px,min(2vw,3.8vh),32px);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.cb{display:flex;flex-direction:column;gap:14px;padding:16px 22px 18px;flex:1}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font-size:clamp(64px,6.2vw,120px)}
.bignum span{font-size:clamp(30px,2.7vw,52px);color:var(--faint)}
.prog{position:relative;height:14px;background:var(--track);border-radius:7px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.prog em{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trio{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.trio .trio-c1{min-width:0;display:flex;flex-direction:column;justify-content:center}
.trio .bignum b{font-size:clamp(30px,calc(min(3.6vw / var(--cols) * 3, 7.4vh) / var(--rows)),88px)}
.trio .bignum span{font-size:clamp(15px,calc(min(1.7vw / var(--cols) * 3, 3.5vh) / var(--rows)),42px)}
.trio .num{font-size:clamp(24px,calc(min(2.6vw / var(--cols) * 3, 5.6vh) / var(--rows)),56px)}
.plist{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;max-height:clamp(84px,17vh,240px)}
.tile{display:flex;flex-direction:column;gap:2px;padding:10px 14px;background:var(--bg);border-radius:10px;min-width:0}
.tile .num{font-size:clamp(40px,3.4vw,64px)}
.tile small{font-size:.5em;color:var(--faint)}
.call{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--bad);color:#fff;font-weight:700;font-size:1.1rem;animation:pulse 1.4s ease-in-out infinite}
.prods{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line2)}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow .pn{font-family:var(--f-num);font-size:1.6rem;font-weight:700}
.prow .pq{margin-left:auto;font-family:var(--f-num);font-size:1.6rem;font-weight:700;white-space:nowrap}
.prow .pq span{color:var(--faint);font-size:.75em}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:4px;white-space:nowrap}
.t-run{background:var(--brand);color:#fff} .t-done{background:var(--ok-soft);color:var(--ok)}
.t-next{background:var(--line2);color:var(--muted)} .t-pend{background:var(--warn-soft);color:var(--warn-ink)}
.dest{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:.95rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.ln{width:22px;border-top:3px solid var(--ink);display:inline-block}

/* gráficos */
.chart{display:flex;flex-direction:column;gap:4px;min-width:0}
.plot{position:relative;border-bottom:2px solid #C9D2DC}
.plot .cols{position:absolute;inset:0;display:flex}
.plot .col{position:relative;flex:1;height:100%}
.plot .bar{position:absolute;left:15%;right:15%;bottom:0;border-radius:4px 4px 0 0}
.plot .val{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-num);font-weight:700;color:var(--ink)}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.xl{display:flex}
.xl span{flex:1;text-align:center;color:var(--muted);font-size:.85rem;min-width:0}
.xl span.cur{color:var(--ink);font-weight:700}
/* Rotulo inicio-fim no Monitor Geral (escopado) */
.xl.xl-faixa span{font-size:clamp(8px,.62vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;min-width:0}
.lplot{position:relative;border-bottom:2px solid #C9D2DC;border-left:1px solid var(--line)}
.lplot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lplot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:.75rem;color:var(--faint)}
.lplot .gl span{position:absolute;left:4px;top:-16px}

/* monitor da célula */
.chead{display:flex;flex-wrap:wrap;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.chead .nm{flex:1;min-width:260px;display:flex;flex-direction:column;justify-content:center;padding:12px 24px}
.chead .nm .num{font-size:clamp(40px,4.2vw,72px)}
.chead .st{display:flex;align-items:center;gap:14px;padding:14px 28px;font-family:var(--f-num);font-weight:700;font-size:clamp(34px,3.4vw,62px);letter-spacing:.03em}
.chead .ck{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:12px 24px}
.chead .ck .num{font-size:clamp(40px,3.8vw,70px)}
.kpi4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-bottom:18px}
.kp{display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 22px;min-width:0}
.kp .num{font-size:clamp(64px,6vw,120px)}
.kp .num small{font-size:.42em;color:var(--faint)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,480px);gap:18px}
@media (max-width:900px){.cgrid{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:16px}
.helpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.helpbtn{min-height:64px;border:2px solid #C9D2DC;border-radius:12px;background:var(--bg);font-family:var(--f-num);font-size:1.5rem;font-weight:700}
.helpbtn:hover{border-color:var(--brand)}
.helpbtn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.selcel{min-height:36px;padding:0 8px;border:1px solid #C9D2DC;border-radius:6px;background:var(--surface);font-size:.95rem;max-width:240px}

/* monitores sempre inteiros na tela (sem rolagem) */
body.fit{display:flex;flex-direction:column;overflow:hidden}
body.fit .top{position:relative;top:0;flex-shrink:0}
body.fit main#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-block:12px}
.mon{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.mon .mhead{margin:0;flex-shrink:0}
.mon .cells{flex:1;min-height:0;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:14px}
.mon .cc{min-height:0}
.mon .cb{min-height:0;gap:min(12px,1.2vh);padding:min(14px,1.4vh) 20px}
.mon .band{min-height:0;padding-block:min(10px,1vh)}
.mon .bignum b{font-size:clamp(34px,calc(min(5.6vw / var(--cols) * 3, 10vh) / var(--rows)),120px)}
.mon .bignum span{font-size:clamp(18px,calc(min(2.4vw / var(--cols) * 3, 4.6vh) / var(--rows)),52px)}
.mon .tile .num{font-size:clamp(26px,calc(min(3.2vw / var(--cols) * 3, 6vh) / var(--rows)),64px)}
.mon .chartbox{flex:1 1 0%;min-height:56px;overflow:hidden;display:flex;flex-direction:column}
.mon .chart{flex:1;min-height:0}
.mon .plot{flex:1 1 auto;min-height:24px}
.mon .prods{flex:0 1 auto;min-height:0;padding-top:min(10px,1vh);gap:min(8px,.8vh)}
.mon .cb{overflow:hidden}
.mon .prow .pn,.mon .prow .pq{font-size:clamp(16px,2.4vh,26px)}
.mon .trio .num.fase{font-size:clamp(12px,2vh,24px);padding-top:6px;line-height:1.15;text-wrap:balance}
.mon .plist{flex:0 1 auto;min-height:0;max-height:min(30%,170px);overflow-y:auto;overflow-x:hidden}
.mon .plist .prow{flex-wrap:nowrap;gap:8px;min-width:0}
.mon .plist .prow .pn{font-size:.95rem;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon .plist .prow .pq,.mon .plist .prow .dest,.mon .plist .prow .muted{flex-shrink:0}
.mon .legend{margin:0;flex-shrink:0;font-size:.9rem}
.mon .chead{margin:0;flex-shrink:0}
.mon .kpi4{margin:0;flex-shrink:0;gap:14px;grid-template-columns:1.5fr 1fr 1fr 1fr}
.mon .kp{padding:min(14px,1.4vh) 20px;gap:4px}
.mon .kp .num{font-size:clamp(40px,min(5.4vw,11vh),130px)}
.mon .cgrid{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.mon .cgrid > .panel{display:flex;flex-direction:column;min-height:0}
.mon .side{min-height:0;overflow:hidden}
.mon .side .panel{padding:min(14px,1.4vh) 18px}
.mon .helpbtn{min-height:min(64px,6vh)}
.mon .call{flex-shrink:0}
.mon .chead .nm .num{font-size:clamp(32px,min(4vw,7vh),72px)}
.mon .chead .st{font-size:clamp(28px,min(3.2vw,6vh),62px);padding-block:min(14px,1.2vh)}
.mon .chead .ck .num{font-size:clamp(32px,min(3.6vw,6.5vh),70px)}
body.tv .selcel{display:none}
@media (max-width:760px),(max-height:520px){
  body.fit{display:block;overflow:auto}
  body.fit main#view{display:block;overflow:visible}
  .mon .cells{grid-template-columns:1fr;grid-template-rows:none}
  .mon .plot{height:180px;flex:none}
  .mon .kpi4{grid-template-columns:1fr 1fr}
  .mon .cgrid{grid-template-columns:1fr}
}

/* gestão */
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #C9D2DC;background:var(--surface);font-weight:700}
.subtabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .num{font-size:2.4rem}
.kpi .sub{font-size:.88rem;color:var(--muted)}
.scroll{overflow-x:auto}
.grid-t{display:flex;flex-direction:column;min-width:var(--mw,900px)}
.gr{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line2)}
.gr.h{font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--muted);border-bottom-color:var(--line)}
.gr .r{text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.cdet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.hbar{display:flex;align-items:center;gap:12px}
.hbar .t{width:150px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .b{flex:1;height:22px;background:var(--track);border-radius:4px;overflow:hidden}
.hbar .b i{display:block;height:100%}
.hbar .v{width:90px;text-align:right;font-weight:600}
.note{padding:12px 14px;background:var(--warn-soft);border:1px solid #F0C877;border-radius:8px;line-height:1.4}
.cal{display:flex;flex-wrap:wrap;gap:6px}
.cal div{width:64px;padding:6px 4px;border-radius:6px;text-align:center;font-size:.78rem;line-height:1.2}
.cal b{display:block;font-size:1rem}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

/* apontamento */
.ap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
@media (max-width:960px){.ap{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:52px;padding:0 16px;border:2px solid #C9D2DC;border-radius:10px;background:var(--surface);font-weight:700;font-size:1.05rem}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.seg.big button{min-height:64px;font-size:1.3rem;padding:0 22px}
.qty{font-family:var(--f-num);font-size:3.4rem;font-weight:700;min-height:92px;width:100%;padding:0 16px;border:2px solid #C9D2DC;border-radius:12px;text-align:center;background:var(--surface)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.bigbtn{min-height:72px;width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:1.4rem;font-weight:700}
.bigbtn:hover{background:var(--brand-ink)}
.bigbtn:disabled{opacity:.5}
.lote{display:flex;flex-wrap:wrap;gap:10px}
.lote button{flex:1;min-width:140px;min-height:64px;border:2px solid var(--brand);border-radius:12px;background:var(--surface);color:var(--brand-ink);font-size:1.15rem;font-weight:700}
.lote button:hover{background:var(--brand-soft)}
.reg{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.reg.x{color:var(--faint);text-decoration:line-through}
.pend{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px}
.pend .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pend input{width:140px;font-family:var(--f-num);font-size:1.6rem;font-weight:700;text-align:center}
.tu-q{width:120px;font-family:var(--f-num);font-size:1.5rem;font-weight:700;text-align:center}
.mx{display:grid;gap:4px;min-width:var(--mw,720px)}
.mx > *{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.92rem}
.mx .h{font-weight:700;color:var(--muted);font-size:.78rem}
.mx .n{justify-content:flex-start;font-weight:700;padding-left:6px}
.mx button{border:1px solid transparent;font-weight:600;width:100%}
.mx .f{background:var(--line2);color:var(--faint)}
.mx .o{background:var(--ok-soft);color:var(--ok)}
.mx .l{background:var(--bad-soft);color:var(--bad-ink)}
.mx .m{background:var(--warn-soft);color:var(--warn-ink);border-color:#F0C877}
.mx .sel{outline:3px solid var(--brand);outline-offset:-2px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.linkrow code{font-size:.85rem;background:var(--line2);padding:4px 8px;border-radius:6px;word-break:break-all;flex:1;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px 10px 20px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast button{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;font-weight:700}

/* programação */
.metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.metas .inp{width:100%;text-align:right}
.prodrow{display:grid;grid-template-columns:minmax(120px,1.6fr) 96px 96px 96px 110px 110px auto;gap:8px;align-items:end;min-width:800px}
.cellbox{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}

body.tv .top{display:none}
body.tv main#view{padding-block:12px}
.tvexit{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;opacity:.35}
.tvexit:hover,.tvexit:focus-visible{opacity:1}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.userchip{display:flex;align-items:center;gap:8px;align-self:flex-end;font-size:.9rem;color:var(--muted)}
.userchip b{color:var(--ink)}
.login{max-width:440px;margin:32px auto}
.login form{display:flex;flex-direction:column;gap:12px}
.login .inp{width:100%}
.err{color:var(--bad-ink);font-weight:600;min-height:1.2em;margin:0}
details summary{cursor:pointer;font-weight:600;color:var(--brand);min-height:44px;display:flex;align-items:center}
body.nologin .top nav,body.nologin .top-tools{display:none}
</style>

  const espF = metas.map((m, i) => m * frac[i]);
  const esp = Math.round(espF.reduce((a, b) => a + b, 0));
  const metaDia = metas.reduce((a, b) => a + b, 0);
  const tot = real.reduce((a, b) => a + b, 0);
  const cur = F.findIndex((_, i) => now >= ini[i] && now < fim[i]);
  const fase = now < ini[0] ? 'antes' : now >= fim[n - 1] ? 'fim' : cur >= 0 ? 'turno' : 'pausa';
  const d = tot - esp;
  const paradasCel = (ctx.paradas || []).filter((p) => p.cel === c.id);
  const parAt = paradasCel.find((p) => !p.fim && p.status !== 'resolvida');
  const calls = (ctx.chamados || []).filter((x) => x.cel === c.id && x.status !== 'resolvido');
  let st;
  if (parAt && isFinite(now)) st = 'stop';
  else if (esp === 0 && tot === 0) st = 'wait';
  else if (d >= 0) st = 'ok';
  else if (esp > 0 && d / esp >= -LIM) st = 'warn';
  else st = 'late';
  const progMin = F.reduce((a, _, i) => a + frac[i] * (fim[i] - ini[i]), 0);
  const restMin = Math.max(0, Math.round(F.reduce((a, _, i) => a + (1 - frac[i]) * (fim[i] - ini[i]), 0)));
  let proj = tot;
  if (fase !== 'fim' && isFinite(now)) {
    let last = -1; for (let i = n - 1; i >= 0; i--) if (frac[i] === 1) { last = i; break; }
    const rate = last >= 0 ? real[last] / (fim[last] - ini[last]) : (progMin > 0 ? tot / progMin : 0);
    proj = Math.round(tot + rate * restMin);
  }
  let lastDone = -1; for (let i = n - 1; i >= 0; i--) if (frac[i] === 1) { lastDone = i; break; }
  const prods = (cp.produtos || []).filter((p) => p && p.nome).map((p) => {
    const feito = ap.filter((a) => norm(a.produto) === norm(p.nome)).reduce((s, a) => s + (+a.qtd || 0), 0);
    const pi = toMin(p.ini), pf = toMin(p.fim), temJ = !isNaN(pi) && !isNaN(pf);
    let tag;
    if (feito >= (+p.qtd || 0) && (+p.qtd || 0) > 0) tag = 'done';
    else if (temJ ? (now >= pi && now < pf) : fase === 'turno' || fase === 'pausa') tag = 'run';
    else if (temJ ? now < pi : fase === 'antes') tag = 'next';
    else tag = 'pend';
    return { nome: p.nome, destino: p.destino || 'WARD', qtd: +p.qtd || 0, cx: +p.cx || 0, ini: p.ini, fim: p.fim, feito, janela: temJ ? short(p.ini) + '–' + short(p.fim) + 'h' : 'dia todo', tag };
  });
  const faixasOk = real.filter((v, i) => frac[i] > 0 && espF[i] > 0 && v >= espF[i] * (1 - LIM)).length;
  const faixasPass = frac.filter((f, i) => f > 0 && metas[i] > 0).length;
  const perdas = paradasCel.reduce((s, p) => s + parMin(p, now), 0);
  const disp = progMin > 0 ? Math.max(0, 1 - perdas / progMin) : null;
  const ops = +c.operadores || 0;
  const prodHH = ops && progMin > 0 ? tot / (ops * progMin / 60) : null;
  return { c, metas, real, espF, esp, metaDia, tot, cur, fase, d, st, parAt, calls, proj, restMin, prods, faixasOk, faixasPass, perdas, paradasCel, frac, progMin, disp, prodHH, lastDone, F };
}
function calcAll() {
  const now = nowMin();
  const cells = cellsAtivas().map((c) => calcCell(c, now));
  const t = cells.reduce((a, x) => ({ tot: a.tot + x.tot, meta: a.meta + x.metaDia, esp: a.esp + x.esp }), { tot: 0, meta: 0, esp: 0 });
  t.d = t.tot - t.esp;
  t.st = t.esp === 0 && t.tot === 0 ? 'wait' : t.d >= 0 ? 'ok' : t.d / t.esp >= -LIM ? 'warn' : 'late';
  const cont = { ok: 0, warn: 0, late: 0, stop: 0, wait: 0 };
  cells.forEach((x) => cont[x.st]++);
  return { now, cells, t, cont };
}

// ---------- gráficos ----------
function chart(metas, real, frac, cur, espF, opts) {
  const n = metas.length; if (!n) return '';
  const vs = opts.valSize || 18;
  const max = Math.max(1, ...metas, ...real) * 1.2;
  const y = (v) => (100 - (v / max) * 100).toFixed(2);
  const pts = [];
  metas.forEach((m, i) => { pts.push(((i / n) * 100).toFixed(2) + ',' + y(m)); pts.push((((i + 1) / n) * 100).toFixed(2) + ',' + y(m)); });
  const labels = opts.labels || faixas().map((f) => short(f.ini));
  const cols = real.map((v, i) => {
    if (frac[i] === 0 && v === 0) return '<div class="col"></div>';
    const ref = i === cur ? espF[i] : metas[i];
    const ok = ref <= 0 ? true : v >= ref * (1 - LIM);
    const h = ((v / max) * 100).toFixed(1);
    return '<div class="col"><div class="bar" style="height:' + h + '%;background:var(' + (ok ? '--brand' : '--bad') + ');' + (i === cur ? 'opacity:.55;' : '') + '"></div>' +
      (opts.noVals ? '' : '<span class="val" style="bottom:calc(' + h + '% + 4px);font-size:' + vs + 'px">' + fmt(v) + '</span>') + '</div>';
  }).join('');
  const xl = labels.map((l, i) => '<span class="' + (i === cur ? 'cur' : '') + '">' + esc(l) + (i === cur ? '▸' : '') + (opts.metaLbl ? '<br><small class="muted">meta ' + fmt(metas[i]) + '</small>' : '') + '</span>').join('');
  return '<div class="chart"><div class="plot" style="' + (opts.fill ? '' : 'height:' + (opts.h || 200) + 'px') + '"><div class="cols">' + cols + '</div>' +
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts.join(' ') + '" fill="none" stroke="#141A22" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>' +
    '<div class="xl' + (opts.xlClass ? ' ' + opts.xlClass : '') + '">' + xl + '</div></div>';
}
function lineChart(labels, series, h) {
  const n = labels.length; if (n < 2) return '';
  const max = Math.max(1, ...series.flatMap((s) => s.vals.filter((v) => v != null))) * 1.1;
  const step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const grid = []; for (let v = step; v < max; v += step) grid.push(v);
  const lines = series.map((s) => {
    const pts = s.vals.map((v, i) => (v == null ? null : ((i / (n - 1)) * 100).toFixed(2) + ',' + (100 - (v / max) * 100).toFixed(2))).filter(Boolean);
    return '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.w || 3) + '" ' + (s.dash ? 'stroke-dasharray="6 5"' : '') + ' vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
  }).join('');
  return '<div class="lplot" style="height:' + h + 'px">' + grid.map((v) => '<div class="gl" style="top:' + (100 - (v / max) * 100).toFixed(2) + '%"><span>' + fmt(v) + '</span></div>').join('') +
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' + lines + '</svg></div>' +
    '<div class="xl" style="justify-content:space-between">' + labels.map((l) => '<span style="flex:0 0 auto">' + esc(l) + '</span>').join('') + '</div>';
}
const progBar = (x) => {

function autoFaixa(F, now) {
  const cur = F.findIndex((f) => now >= toMin(f.ini) && now < toMin(f.fim));
  if (cur >= 0) return cur;
  const done = F.filter((f) => now >= toMin(f.fim)).length;
  return Math.max(0, Math.min(F.length - 1, done - 1));
}

  const rows = cells.map((c) => {

    const prods = (cp.produtos || []).filter((p) => p && p.nome && prodInFaixa(p, f));
    const meta = +((cp.metas || [])[i]) || 0;
    const lines = prods.map((p, j) => {

function prodStats(ctxs, celFilter, prodFilter) {
  // ctxs: [{date, ctx}] → por produto e por célula×produto
  const P = {}, CP = {};
  ctxs.forEach(({ date, ctx }) => {
    const F = fxOf(ctx);
    const grp = {};
    (ctx.apont || []).filter((a) => a.status !== 'cancelado' && (!celFilter || a.cel === celFilter) && (!prodFilter || norm(a.produto) === prodFilter)).forEach((a) => {
      const k = norm(a.produto);
      P[k] = P[k] || { nome: a.produto, total: 0, prog: 0, cels: new Set(), dias: new Set(), destino: a.destino || 'WARD', rates: [] };
      P[k].total += +a.qtd || 0; P[k].cels.add(a.cel); P[k].dias.add(date);
      const g = date + '|' + a.cel + '|' + a.faixa + '|' + k; grp[g] = (grp[g] || 0) + (+a.qtd || 0);
    });
    Object.entries(grp).forEach(([g, q]) => {
      const [, cel, fx, k] = g.split('|'); const f = F[+fx]; if (!f) return;
      const h = (toMin(f.fim) - toMin(f.ini)) / 60; if (!(h > 0)) return;
      const r = q / h; P[k].rates.push(r);
      const ck = cel + '|' + k; CP[ck] = CP[ck] || { cel, nome: P[k].nome, rates: [], total: 0 }; CP[ck].rates.push(r); CP[ck].total += q;
    });
    Object.entries((ctx.prog && ctx.prog.cells) || {}).forEach(([cel, cp]) => {
      if (celFilter && cel !== celFilter) return;
      (cp.produtos || []).forEach((p) => {
        const k = norm(p.nome); if (!k || (prodFilter && k !== prodFilter)) return;
        P[k] = P[k] || { nome: p.nome, total: 0, prog: 0, cels: new Set(), dias: new Set(), destino: p.destino || 'WARD', rates: [] };
        P[k].prog += +p.qtd || 0; P[k].cels.add(cel);
      });
    });
  });
  return { P: Object.values(P).sort((a, b) => b.total - a.total), CP: Object.values(CP).sort((a, b) => celName(a.cel).localeCompare(celName(b.cel)) || b.total - a.total) };
}
function chamStats(ctxs) {

    A[k.area].n++;
    if (k.status !== 'resolvido') A[k.area].abertos++;
    else { const t = toMin(k.fimHora) - toMin(k.hora); if (t >= 0) A[k.area].tempos.push(t); }
  }));
  return Object.values(A);
}

function newDraft(src) {

  });

}
async function saveProg() {
  const D = S.draft;
  const bad = D.faixas.find((f) => isNaN(toMin(f.ini)) || isNaN(toMin(f.fim)) || toMin(f.fim) <= toMin(f.ini));
  if (bad) return toast('Confira as faixas: cada uma precisa de início e fim, com o fim depois do início.');
  const order = D.faixas.map((f, i) => i).sort((a, b) => toMin(D.faixas[a].ini) - toMin(D.faixas[b].ini));
  const faixasOrd = order.map((i) => D.faixas[i]);
  const cells = {};
  D.celulas.forEach((c) => {
    const cp = D.cells[c.id]; if (!cp) return;
    cells[c.id] = { ativa: cp.ativa !== false, metas: order.map((i) => Math.max(0, Math.round(+cp.metas[i] || 0))), produtos: cp.produtos.filter((p) => String(p.nome || '').trim()).map((p) => ({ nome: String(p.nome).trim(), destino: p.destino === 'PV' ? 'PV' : 'WARD', qtd: Math.max(0, Math.round(+p.qtd || 0)), cx: Math.max(0, Math.round(+p.cx || 0)), ini: p.ini || '', fim: p.fim || '' })) };
  });
  try {
    await S.db.doc('config/celulas').set({ celulas: D.celulas.map((c) => ({ id: c.id, nome: String(c.nome || c.id).trim(), operadores: Math.max(0, +c.operadores || 0), postos: Math.max(0, +c.postos || 0) })) });
    await S.db.doc('dias/' + S.date).set({ data: S.date, faixas: faixasOrd, cells, atualizado: new Date().toISOString() });
    S.draftDirty = false; S.remoteChanged = false; S.draft = null;
    toast('Programação salva');
  } catch (e) { toast(errMsg(e)); }
}

// ---------- ações ----------
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Você não tem permissão para esta alteração.';
  if (c === 'quota_exceeded') return 'A base atingiu o limite de registros. Avise o responsável pelo Andon.';
  if (c === 'resource_exhausted') return 'Muitas ações seguidas. Aguarde alguns segundos e tente de novo.';
  return 'Não foi possível salvar agora. Verifique a conexão e tente de novo.';
}
let toastT, toastFn = null;
function toast(msg, action) {
  const t = $('#toast'); $('#toast-t').textContent = msg;
  const b = $('#toast-b');
  if (action) { b.textContent = action.label; b.hidden = false; toastFn = action.fn; } else { b.hidden = true; toastFn = null; }
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; toastFn = null; }, action ? 7000 : 3400);
}

async function tuLancar() {
  const i = S.tu.faixa; const items = [];
  Object.entries(S.tu.vals).forEach(([key, v]) => {
    const q = Math.round(+v); if (!(q > 0)) return;
    const [cel, prod] = key.split('|');
    const nome = prod === '__outro' ? String(S.tu.outros[cel] || '').trim() : prod;
    if (nome) items.push({ cel, nome, q });
  });
  if (!items.length) return toast('Preencha ao menos uma quantidade (e o nome, se for outro produto).');

async function registrarParada(cel, ini, fim, motivo, obs) {

  if (fim && toMin(fim) <= toMin(ini)) return toast('O fim precisa ser depois do início.');

    await S.db.collection('dias/' + S.date + '/paradas').add({ cel, ini, fim: fim || '', motivo, obs: obs || '', resp: '', status: 'registrada', criado: new Date().toISOString() });
    toast(fim ? 'Parada registrada' : 'Parada em andamento: o monitor mostra PARADA até encerrar');

  } catch (e) { toast(errMsg(e)); return false; }
}

// ---------- base de dados (Supabase) com a mesma interface usada pelas telas ----------
function makeDb(sb) {
  const MAP = { fimHora: 'fim_hora', resolvidoEm: 'resolvido_em', canceladoEm: 'cancelado_em' };
  const UNMAP = Object.fromEntries(Object.entries(MAP).map(([a, b]) => [b, a]));
  const COLS = {
    apont: ['cel', 'faixa', 'produto', 'destino', 'qtd', 'operador', 'status', 'criado', 'cancelado_em'],
    paradas: ['cel', 'ini', 'fim', 'motivo', 'obs', 'resp', 'status', 'criado'],
    chamados: ['cel', 'area', 'hora', 'fim_hora', 'status', 'criado', 'resolvido_em']
  };
  const toRow = (t, o) => { const r = {}; Object.entries(o).forEach(([k, v]) => { const kk = MAP[k] || k; if (COLS[t].includes(kk)) r[kk] = v; }); return r; };
  const fromRow = (r) => { const o = {}; Object.entries(r).forEach(([k, v]) => { o[UNMAP[k] || k] = v; }); return o; };
  const err = (e) => { const x = new Error(e.message || 'erro'); x.code = (e.code === '42501' || /row-level security|permission/i.test(e.message || '')) ? 'invalid_argument' : 'unavailable'; return x; };
  const parse = (p) => p.split('/');
  const snapDoc = (d) => ({ exists: !!d, data: () => d || undefined });
  const snapQ = (rows) => ({ docs: rows.map((r) => ({ id: r.id, data: () => r })), size: rows.length, empty: !rows.length });
  async function fetchDoc(p) {
    const s = parse(p);
    if (s[0] === 'config') { const { data, error } = await sb.from('celulas').select('*').order('ordem'); if (error) throw err(error); return data.length ? { celulas: data } : null; }
    const { data, error } = await sb.from('dias').select('*').eq('data', s[1]).maybeSingle(); if (error) throw err(error);
    return data ? { data: data.data, faixas: data.faixas, cells: data.cells } : null;
  }
  async function fetchCol(p) {
    const s = parse(p);
    if (s.length === 1) { const { data, error } = await sb.from('dias').select('data'); if (error) throw err(error); return data.map((r) => ({ id: r.data })); }
    const { data, error } = await sb.from(s[2]).select('*').eq('data', s[1]).order('criado'); if (error) throw err(error);
    return data.map(fromRow);
  }
  const rtFor = (p) => { const s = parse(p); if (s[0] === 'config') return ['celulas', null]; if (s.length === 1) return ['dias', null]; if (s.length === 2) return ['dias', 'data=eq.' + s[1]]; return [s[2], 'data=eq.' + s[1]]; };
  let n = 0;
  function listen(p, load, next, error) {
    let alive = true, t = null;
    const run = () => load().then((v) => { if (alive) next(v); }).catch((e) => { if (alive && error) error(e); });
    const soon = () => { clearTimeout(t); t = setTimeout(run, 250); };
    const [table, filter] = rtFor(p);
    const ch = sb.channel('rt-' + (++n) + '-' + table).on('postgres_changes', Object.assign({ event: '*', schema: 'public', table }, filter ? { filter } : {}), soon).subscribe();
    const iv = setInterval(run, 60000);
    run();
    return () => { alive = false; clearInterval(iv); clearTimeout(t); sb.removeChannel(ch); };
  }
  return {
    doc(p) {
      const s = parse(p);
      return {
        id: s[s.length - 1],
        get: async () => snapDoc(await fetchDoc(p)),
        onSnapshot: (next, error) => listen(p, async () => snapDoc(await fetchDoc(p)), next, error),
        set: async (o) => {
          if (s[0] === 'config') { const rows = o.celulas.map((c, i) => ({ id: c.id, nome: c.nome, operadores: c.operadores, postos: c.postos, ordem: i + 1 })); const { error } = await sb.from('celulas').upsert(rows); if (error) throw err(error); return; }
          const { error } = await sb.from('dias').upsert({ data: s[1], faixas: o.faixas, cells: o.cells, atualizado: new Date().toISOString() }); if (error) throw err(error);
        },
        update: async (o) => { const { error } = await sb.from(s[2]).update(toRow(s[2], o)).eq('id', s[3]); if (error) throw err(error); }
      };
    },
    collection(p) {
      const s = parse(p);
      return {
        get: async () => snapQ(await fetchCol(p)),
        onSnapshot: (next, error) => listen(p, async () => snapQ(await fetchCol(p)), next, error),
        add: async (o) => { const row = toRow(s[2], o); row.data = s[1]; const { data, error } = await sb.from(s[2]).insert(row).select('id').single(); if (error) throw err(error); return { id: data.id }; }
      };
    }
  };
}

    '<section class="panel"><h2 style="margin-bottom:12px">Novo acesso</h2><form id="f-user" class="form-grid" style="align-items:end">' +
      '<div class="field"><label for="nu-nome">Nome (pessoa ou PC)</label><input id="nu-nome" class="inp" required placeholder="ex.: PC Célula Haste"></div>' +
      '<div class="field"><label for="nu-email">E-mail de acesso</label><input id="nu-email" class="inp" type="email" required placeholder="ex.: haste@dlean.com.br" autocomplete="off"></div>' +
      '<div class="field"><label for="nu-senha">Senha inicial</label><input id="nu-senha" class="inp" type="text" minlength="6" required autocomplete="off"></div>' +
      '<div class="field"><label for="nu-papel">Papel</label><select id="nu-papel" class="inp"><option value="operador">Operador / gestor</option><option value="admin">Administrador (PCP)</option></select></div>' +
      '<button class="btn pri" type="submit">Criar acesso</button></form>' +
      '<p class="muted" style="margin:12px 0 0;font-size:.9rem">O e-mail serve só como nome de usuário: pode ser inventado (ex.: tv-fabrica@dlean.com.br), não precisa existir. Administrador monta a programação e gerencia usuários; operador/gestor vê os monitores e lança produção, paradas e chamados.</p></section>' +
    '<section class="panel"><div class="phead"><h2>Acessos cadastrados</h2><span class="muted">' + S.users.length + ' usuários</span></div>' +
      gt('1.6fr 1.3fr 1fr 1.6fr auto', 860, ['NOME', 'PAPEL', 'ÚLTIMO ACESSO', 'SENHA', ''], rows, 'Nenhum usuário') + '</section></div>';
}
async function loadUsers() {
  S.usersLoading = true;
  try { const r = await callFn({ action: 'listar' }); S.users = r.usuarios || []; S.usersMe = r.eu; }
  catch (e) { toast(e.message); S.users = []; }
  S.usersLoading = false;
  if (S.view === 'usuarios') render();
}
document.addEventListener('submit', async (ev) => {
  const f = ev.target; ev.preventDefault();
  const btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (f.id === 'f-login') {
      $('#lg-err').textContent = '';
      const { data, error } = await S.sb.auth.signInWithPassword({ email: $('#lg-email').value.trim(), password: $('#lg-senha').value });
      if (error) { $('#lg-err').textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message; return; }
      await afterLogin(data.session);
    } else if (f.id === 'f-boot') {
      $('#bt-err').textContent = '';
      const email = $('#bt-email').value.trim(), senha = $('#bt-senha').value;
      try { await callFn({ action: 'bootstrap', code: $('#bt-code').value.trim(), nome: $('#bt-nome').value.trim(), email, senha }); }
      catch (e) { $('#bt-err').textContent = e.message; return; }
      const { data, error } = await S.sb.auth.signInWithPassword({ email, password: senha });
      if (error) { $('#bt-err').textContent = 'Administrador criado. Entre com o e-mail e a senha.'; S.temAdmin = true; return; }
      await afterLogin(data.session);
    } else if (f.id === 'f-user') {
      await callFn({ action: 'criar', nome: $('#nu-nome').value.trim(), email: $('#nu-email').value.trim(), senha: $('#nu-senha').value, papel: $('#nu-papel').value });
      toast('Acesso criado para ' + $('#nu-nome').value.trim()); f.reset(); S.users = null; render();
    }
  } catch (e) { toast(e.message || 'Não foi possível concluir.'); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'btn-logout' || t.id === 'btn-logout2') { try { await S.sb.auth.signOut(); } catch (e) {} location.hash = ''; location.reload(); return; }
  if (d.uPw) { const v = $('#pw-' + CSS.escape(d.uPw)).value; try { await callFn({ action: 'senha', user_id: d.uPw, senha: v }); toast('Senha alterada'); $('#pw-' + CSS.escape(d.uPw)).value = ''; } catch (e) { toast(e.message); } return; }
  if (d.uDel) {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Confirmar remoção'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Remover'; } }, 4000); return; }
    try { await callFn({ action: 'remover', user_id: d.uDel }); toast('Acesso removido'); S.users = null; render(); } catch (e) { toast(e.message); }
  }
});
document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.dataset.uPapel) { try { await callFn({ action: 'papel', user_id: t.dataset.uPapel, papel: t.value }); toast('Papel atualizado'); } catch (e) { toast(e.message); S.users = null; render(); } }
});

(async () => {
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  S.authLoading = true; render();
  if (!window.supabase) { S.authLoading = false; $('#view').innerHTML = '<div class="empty"><b>Não foi possível carregar o sistema</b>Verifique a internet e recarregue a página.</div>'; return; }
  S.sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  S.sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT' && S.perfil) location.reload(); });
  const { data: { session } } = await S.sb.auth.getSession();
  if (session) { await afterLogin(session); return; }
  try { const r = await callFn({ action: 'status' }); S.temAdmin = !!r.temAdmin; } catch (e) { S.temAdmin = true; }
  S.authLoading = false; render();
})();
})();
</script>
</body>
